<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>HalleBot Platformer | Derell Speed</title>
  <link href="platformer.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.1.0.js"></script>
  <script src="setup.js"></script>
  <script src="helpers.js"></script>
  <script src="platformer.js"></script>
</head>

<body id="body">
  <main class="game-shell">
    <header class="game-header">
      <div>
        <p class="eyebrow">Derell Speed presents</p>
        <h1>HalleBot Platformer</h1>
      </div>
      <p class="objective">Collect the diamonds. Dodge the cannon fire.</p>
    </header>
    <div class="game-stage">
      <canvas id="canvas" width="1400" height="750"></canvas>
    </div>
    <footer class="controls" aria-label="Game controls">
      <span><b>Move</b> A / D or arrow keys</span>
      <span><b>Jump</b> W, up arrow, or space</span>
      <a href="../../portfolio.html">Back to portfolio <span aria-hidden="true">-></span></a>
    </footer>
  </main>
  <img id="cannon" src="images/cannon.png" />
  <img id="player" src="images/halle.png" />
  <img id="projectile" src="images/projectile.png" />
</body>

</html>
